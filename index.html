<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTZ Chaufførvejledning</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-ftz">FTZ</span>
        <span class="logo-sub">Chaufførvejledning</span>
      </div>
      <button class="search-toggle" id="searchToggle" aria-label="Søg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Søg i vejledninger..." autocomplete="off" />
      <button class="search-clear" id="searchClear">✕</button>
    </div>
  </header>

  <main class="main">
    <div id="homeView">
      <div class="hero">
        <p class="hero-label">Hurtig adgang til</p>
        <h1 class="hero-title">Vejledninger for chauffører</h1>
        <p class="hero-desc">Alt hvad du skal bruge i din dagligdag som FTZ-chauffør — hurtigt og nemt.</p>
      </div>
      <section class="quick-actions">
        <button class="quick-btn urgent" data-category="noedsituationer"><span class="quick-icon">🚨</span><span>Nødsituationer</span></button>
        <button class="quick-btn" data-category="loefteteknik"><span class="quick-icon">💪</span><span>Løfteteknik</span></button>
        <button class="quick-btn" data-category="farlige-stoffer"><span class="quick-icon">⚠️</span><span>Farlige stoffer</span></button>
        <button class="quick-btn" data-category="koeregler"><span class="quick-icon">🚐</span><span>Køregler</span></button>
      </section>
      <section class="categories-section">
        <h2 class="section-title">Alle vejledninger</h2>
        <div class="category-grid" id="categoryGrid"></div>
      </section>
    </div>
    <div id="categoryView" class="hidden">
      <button class="back-btn" id="backBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Tilbage
      </button>
      <div id="categoryHeader"></div>
      <div class="article-list" id="articleList"></div>
    </div>
    <div id="articleView" class="hidden">
      <button class="back-btn" id="backToCategory">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Tilbage
      </button>
      <article id="articleContent"></article>
    </div>
    <div id="searchView" class="hidden">
      <h2 class="section-title" id="searchResultTitle">Søgeresultater</h2>
      <div class="article-list" id="searchResults"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Hjem</span>
    </button>
    <button class="nav-item" data-view="categories">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Kategorier</span>
    </button>
    <button class="nav-item" data-view="favoritter">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Favoritter</span>
    </button>
    <button class="nav-item" data-view="kontakt">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.59 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span>Kontakt</span>
    </button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
